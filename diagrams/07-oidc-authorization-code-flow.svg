<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 959" width="1104" height="959" role="img" aria-label="OIDC Authorization Code flow"><title>OIDC Authorization Code flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8 Z" fill="#2563eb" /></marker></defs><rect x="0" y="0" width="1104" height="959" fill="#ffffff" /><rect x="14" y="13" width="1076" height="43" rx="10" fill="#eef4ff" /><text x="552.0" y="40" text-anchor="middle" font-size="18" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" fill="#15315d">OIDC Authorization Code flow</text><rect x="44.0" y="76" width="242" height="48" rx="8" fill="#eaf0ff" stroke="#a2b5eb" stroke-width="1.1" /><text x="165.0" y="96" text-anchor="middle" font-size="12.4" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600" fill="#17365e">Browser</text><line x1="165.0" x2="165.0" y1="124" y2="920" stroke="#b8c4d8" stroke-width="1.3" stroke-dasharray="5 6" /><rect x="302.0" y="76" width="242" height="48" rx="8" fill="#eaf0ff" stroke="#a2b5eb" stroke-width="1.1" /><text x="423.0" y="96" text-anchor="middle" font-size="12.4" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600" fill="#17365e">BFF / Relying Party</text><line x1="423.0" x2="423.0" y1="124" y2="920" stroke="#b8c4d8" stroke-width="1.3" stroke-dasharray="5 6" /><rect x="560.0" y="76" width="242" height="48" rx="8" fill="#eaf0ff" stroke="#a2b5eb" stroke-width="1.1" /><text x="681.0" y="96" text-anchor="middle" font-size="12.4" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600" fill="#17365e">Keycloak / OpenID Provider</text><line x1="681.0" x2="681.0" y1="124" y2="920" stroke="#b8c4d8" stroke-width="1.3" stroke-dasharray="5 6" /><rect x="818.0" y="76" width="242" height="48" rx="8" fill="#eaf0ff" stroke="#a2b5eb" stroke-width="1.1" /><text x="939.0" y="96" text-anchor="middle" font-size="12.4" font-family="DejaVu Sans,Arial,sans-serif" font-weight="600" fill="#17365e">Order API</text><line x1="939.0" x2="939.0" y1="124" y2="920" stroke="#b8c4d8" stroke-width="1.3" stroke-dasharray="5 6" /><path d="M 423.0 186 h 32 v 22 h -32" fill="none" stroke="#2563eb" stroke-width="1.65" marker-end="url(#arrow)" /><rect x="304.0" y="136" width="238" height="44" rx="5" fill="#fff9ec" stroke="#f1dba8" /><text x="314.0" y="154" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Create state, nonce, PKCE</text><text x="314.0" y="171" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">verifier/challenge</text><text x="20" y="199" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">1</text><line x1="418.0" x2="173.0" y1="242" y2="242" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#arrow)" /><rect x="105.4" y="209" width="377.2" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="114.4" y="227" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Redirect to /authorize?scope=openid ...</text><text x="20" y="247" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">2</text><line x1="170.0" x2="673.0" y1="290" y2="290" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="239.55" y="257" width="366.9" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="248.55" y="275" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">User authentication / consent</text><text x="20" y="295" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">3</text><line x1="676.0" x2="173.0" y1="338" y2="338" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#arrow)" /><rect x="257.70000000000005" y="305" width="330.59999999999997" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="266.70000000000005" y="323" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Redirect with code + state</text><text x="20" y="343" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">4</text><line x1="170.0" x2="415.0" y1="386" y2="386" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="152.9" y="353" width="282.2" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="161.9" y="371" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Authorization callback</text><text x="20" y="391" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">5</text><line x1="428.0" x2="673.0" y1="451" y2="451" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="363.4" y="401" width="377.2" height="42" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="372.4" y="419" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Exchange code + PKCE verifier + client</text><text x="372.4" y="436" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">authentication</text><text x="20" y="456" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">6</text><line x1="676.0" x2="431.0" y1="516" y2="516" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#arrow)" /><rect x="363.4" y="466" width="377.2" height="42" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="372.4" y="484" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">ID Token + Access Token (+ optional Refresh</text><text x="372.4" y="501" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Token)</text><text x="20" y="521" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">7</text><path d="M 423.0 581 h 32 v 22 h -32" fill="none" stroke="#2563eb" stroke-width="1.65" marker-end="url(#arrow)" /><rect x="304.0" y="531" width="238" height="44" rx="5" fill="#fff9ec" stroke="#f1dba8" /><text x="314.0" y="549" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Validate ID Token, create</text><text x="314.0" y="566" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">OidcUser/session</text><text x="20" y="594" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">8</text><rect x="25" y="606" width="1054" height="30" rx="6" fill="#e5f4ed" stroke="#b2d9c4" /><text x="37" y="626" font-size="12.5" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" fill="#14593b">opt Additional identity claims needed</text><line x1="428.0" x2="673.0" y1="680" y2="680" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="363.4" y="647" width="377.2" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="372.4" y="665" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">GET /userinfo with ACCESS TOKEN</text><text x="20" y="685" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">9</text><line x1="676.0" x2="431.0" y1="728" y2="728" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#arrow)" /><rect x="363.4" y="695" width="377.2" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="372.4" y="713" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">User claims (sub must match ID Token)</text><text x="20" y="733" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">10</text><line x1="418.0" x2="173.0" y1="776" y2="776" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#arrow)" /><rect x="134.75" y="743" width="318.5" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="143.75" y="761" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Secure BFF session cookie</text><text x="20" y="781" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">11</text><line x1="170.0" x2="415.0" y1="824" y2="824" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="146.85" y="791" width="294.3" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="155.85" y="809" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">Orders request + cookie</text><text x="20" y="829" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">12</text><line x1="428.0" x2="931.0" y1="872" y2="872" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="none" marker-end="url(#arrow)" /><rect x="564.1" y="839" width="233.79999999999998" height="25" rx="5" fill="#fff" stroke="#e6ecf4" /><text x="573.1" y="857" font-size="12.0" font-family="DejaVu Sans,Arial,sans-serif" fill="#233047">OAuth Access Token</text><text x="20" y="877" font-size="11" font-family="DejaVu Sans,Arial,sans-serif" fill="#6a7992">13</text><text x="552.0" y="944" text-anchor="middle" font-size="10" font-family="DejaVu Sans,Arial,sans-serif" fill="#64748b">Sequence is conceptual; HTTPS, timeouts, and error-handling messages omitted for readability.</text></svg>